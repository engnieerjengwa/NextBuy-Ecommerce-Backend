spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:ecommerceapp}
spring.datasource.password=${DB_PASSWORD:ecommerceapp}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.data.rest.detection-strategy=annotated

spring.data.rest.base-path=/api
allowed.origins = http://localhost:4200

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

## issuer url must ends with "/"
okta.oauth2.issuer=${OKTA_ISSUER:https://dev-tbkwe1ticmyodaoi.us.auth0.com/}
okta.oauth2.client-id=${OKTA_CLIENT_ID:xt4EDZM5AovUrzYGseQoXtkc880iDpxb}
okta.oauth2.audience=http://localhost:8080

stripe.key.secret = ${STRIPE_API_KEY}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
