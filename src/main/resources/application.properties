spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.data.rest.detection-strategy=annotated

spring.data.rest.base-path=/api
allowed.origins = http://localhost:4200

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

## Google OAuth2 Configuration
app.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}

## JWT Configuration
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHNlY3VyZSBiYXNlNjQgZW5jb2RlZCBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gZ2VuZXJhdGlvbg==}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

stripe.key.secret = ${STRIPE_API_KEY}

# Google Places API Configuration (for address autocomplete)
app.google.places.api-key=${GOOGLE_PLACES_API_KEY:your-google-places-api-key}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
