# ========== Staging Profile ==========
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${STAGING_DB_HOST:localhost}:${STAGING_DB_PORT:3306}/${STAGING_DB_NAME:nexbuy_staging}?useSSL=true&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=${STAGING_DB_USERNAME}
spring.datasource.password=${STAGING_DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.data.rest.detection-strategy=annotated
spring.data.rest.base-path=/api

allowed.origins=https://staging.nexbuy.com

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Stripe (use test keys in staging)
stripe.key.secret=${STRIPE_API_KEY}

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.root=INFO
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=INFO
